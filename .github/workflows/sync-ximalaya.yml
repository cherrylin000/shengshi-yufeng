# 每周从喜马拉雅专辑 API 检查更新，抓取新文稿并重建站点数据，有变更则自动提交到 main。
# 手动触发：GitHub → Actions → Sync Ximalaya album → Run workflow

name: Sync Ximalaya album

on:
  schedule:
    # 每周一 02:00 UTC = 北京时间周一 10:00
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-ximalaya
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Soft-check only: a bad Cookie must not skip album sync / site rebuild.
      - name: Verify XIMALAYA_COOKIE (track 377)
        id: verify_cookie
        continue-on-error: true
        env:
          XIMALAYA_COOKIE: ${{ secrets.XIMALAYA_COOKIE }}
        run: |
          if [ -z "$XIMALAYA_COOKIE" ]; then
            echo "::warning::XIMALAYA_COOKIE secret not set; aiDoc/原文文稿 will be skipped."
            exit 0
          fi
          echo "Cookie secret length (chars): ${#XIMALAYA_COOKIE}"
          set +e
          python scripts/transcripts/fetch_aidoc.py 980020064 --debug 2>&1 | tee aidoc-verify.log
          code=${PIPESTATUS[0]}
          set -e
          echo "fetch_aidoc exit code: $code"
          exit "$code"

      - name: Upload aiDoc verify log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aidoc-verify-log
          path: aidoc-verify.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Sync album list and fetch new transcripts
        env:
          XIMALAYA_COOKIE: ${{ secrets.XIMALAYA_COOKIE }}
        run: |
          if [ "${{ steps.verify_cookie.outcome }}" != "success" ]; then
            echo "::warning::Cookie verify failed; sync continues, but full transcripts may stay unavailable."
          fi
          python scripts/transcripts/sync_album_from_api.py \
            --fetch-transcripts \
            --refetch-incomplete \
            --delay 1.5 \
            --timeout 90

      - name: Rebuild data-index.js and articles
        run: python scripts/site/rebuild_data_js.py

      - name: Update index.html and corpus counts from meta
        run: python scripts/site/update_library_date.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content data-index.js content/articles index.html
          if git diff --staged --quiet; then
            echo "No changes — album already up to date."
          else
            git commit -m "chore: sync Ximalaya album and rebuild site data"
            git push
          fi
