# 每周从喜马拉雅专辑 API 检查更新：
# 1) 抓取 aiDoc / Show Notes 文稿
# 2) 对仍无全文的新集：venv 内下载音频 + faster-whisper 本地 ASR
# 3) 润色文字稿、生成章节目录与 SmartArt 流程图
# 4) 重建站点数据并提交

name: Sync Ximalaya album

on:
  schedule:
    # 每周一 02:00 UTC = 北京时间周一 10:00
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-ximalaya
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Install Python deps (venv)
        run: |
          python -m venv .venv
          .venv/bin/pip install -U pip
          .venv/bin/pip install -r requirements.txt

      # Soft-check only: a bad Cookie must not skip album sync / site rebuild.
      - name: Verify XIMALAYA_COOKIE (track 377)
        id: verify_cookie
        continue-on-error: true
        env:
          XIMALAYA_COOKIE: ${{ secrets.XIMALAYA_COOKIE }}
        run: |
          if [ -z "$XIMALAYA_COOKIE" ]; then
            echo "::warning::XIMALAYA_COOKIE secret not set; aiDoc/原文文稿 will be skipped."
            exit 0
          fi
          echo "Cookie secret length (chars): ${#XIMALAYA_COOKIE}"
          set +e
          .venv/bin/python scripts/transcripts/fetch_aidoc.py 980020064 --debug 2>&1 | tee aidoc-verify.log
          code=${PIPESTATUS[0]}
          set -e
          echo "fetch_aidoc exit code: $code"
          exit "$code"

      - name: Upload aiDoc verify log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aidoc-verify-log
          path: aidoc-verify.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Sync album + local ASR fallback + polish
        env:
          XIMALAYA_COOKIE: ${{ secrets.XIMALAYA_COOKIE }}
        run: |
          if [ "${{ steps.verify_cookie.outcome }}" != "success" ]; then
            echo "::warning::Cookie verify failed; sync continues with shownotes / local ASR fallback."
          fi
          .venv/bin/python scripts/transcripts/weekly_sync.py \
            --asr-limit 2 \
            --asr-from-index 370 \
            --asr-model tiny

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content data-index.js index.html requirements.txt scripts webapp || true
          # ignore large raw audio in commits by default
          git reset content/audio || true
          if git diff --staged --quiet; then
            echo "No changes — album already up to date."
          else
            git commit -m "chore: sync Ximalaya album, local ASR fallback, polish transcripts"
            git push
          fi
