<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>注册 · 盛世裕丰文稿</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}" />
</head>
<body>
  <main class="auth-shell">
    <a class="brand" href="/">盛世裕丰文稿库</a>
    <h1>创建账号</h1>
    <p class="lead">保存已读状态、浏览记录与高亮笔记。</p>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post" class="auth-form" autocomplete="on">
      <label>用户名
        <input name="username" required minlength="2" maxlength="32" placeholder="2–32 个字符" />
      </label>
      <label>密码
        <input type="password" name="password" required minlength="6" placeholder="至少 6 位" />
      </label>
      <label>确认密码
        <input type="password" name="password2" required minlength="6" />
      </label>
      <button type="submit">注册并进入笔记页</button>
    </form>
    <p class="switch">已有账号？<a href="{{ url_for('login') }}">登录</a></p>
  </main>
</body>
</html>
